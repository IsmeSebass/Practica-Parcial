openapi: 3.0.3
info:
  title: API de Biblioteca
  description: |
    API REST para la administración de los libros de una biblioteca.
    Permite registrar, consultar, actualizar y eliminar libros del catálogo.
  version: 1.0.0
  contact:
    name: Equipo de Desarrollo - Biblioteca
    email: soporte@biblioteca.edu
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8081
    description: Entorno local de desarrollo

tags:
  - name: Libros
    description: Operaciones sobre el catálogo de libros

paths:
  /api/v1/libros:
    post:
      tags: [Libros]
      summary: Registrar un libro
      description: Registra un nuevo libro en el catálogo de la biblioteca.
      operationId: registrarLibro
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LibroRequest'
            examples:
              ejemplo:
                value:
                  titulo: "Cien años de soledad"
                  autor: "Gabriel García Márquez"
                  isbn: "978-84-376-0494-7"
                  anioPublicacion: 1967
                  estado: "DISPONIBLE"
      responses:
        '201':
          description: Libro registrado correctamente
          headers:
            Location:
              description: URI del recurso creado
              schema:
                type: string
                example: /api/v1/libros/1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibroResponse'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '409':
          $ref: '#/components/responses/Conflicto'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    get:
      tags: [Libros]
      summary: Consultar libros
      description: >
        Devuelve la lista de libros registrados. Admite filtros opcionales por
        autor y por estado. Si no existen coincidencias devuelve una lista vacía.
      operationId: consultarLibros
      parameters:
        - name: autor
          in: query
          required: false
          description: Filtra por coincidencia parcial del nombre del autor
          schema:
            type: string
            example: "García Márquez"
        - name: estado
          in: query
          required: false
          description: Filtra por el estado del libro
          schema:
            $ref: '#/components/schemas/EstadoLibro'
      responses:
        '200':
          description: Lista de libros obtenida correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LibroResponse'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /api/v1/libros/titulo/{titulo}:
    get:
      tags: [Libros]
      summary: Consultar libro por título
      description: Devuelve el libro cuyo título coincide exactamente (sin distinguir mayúsculas).
      operationId: consultarLibroPorTitulo
      parameters:
        - name: titulo
          in: path
          required: true
          description: Título exacto del libro
          schema:
            type: string
            minLength: 1
            maxLength: 150
            example: "Cien años de soledad"
      responses:
        '200':
          description: Libro encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibroResponse'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /api/v1/libros/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Identificador único del libro
        schema:
          type: integer
          format: int64
          minimum: 1
          example: 1
    get:
      tags: [Libros]
      summary: Consultar libro por id
      description: Devuelve el detalle de un libro a partir de su identificador.
      operationId: consultarLibroPorId
      responses:
        '200':
          description: Libro encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibroResponse'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    put:
      tags: [Libros]
      summary: Actualizar libro
      description: Actualiza por completo los datos de un libro existente.
      operationId: actualizarLibro
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LibroRequest'
            examples:
              ejemplo:
                value:
                  titulo: "Cien años de soledad"
                  autor: "Gabriel García Márquez"
                  isbn: "978-84-376-0494-7"
                  anioPublicacion: 1967
                  estado: "PRESTADO"
      responses:
        '200':
          description: Libro actualizado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibroResponse'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    delete:
      tags: [Libros]
      summary: Eliminar libro
      description: Elimina de forma definitiva un libro del catálogo.
      operationId: eliminarLibro
      responses:
        '204':
          description: Libro eliminado correctamente (sin contenido)
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'

components:
  schemas:
    EstadoLibro:
      type: string
      description: |
        Estado actual del libro dentro de la biblioteca:
          * `DISPONIBLE` - se encuentra en estantería y puede prestarse
          * `PRESTADO`   - actualmente prestado a un lector
          * `EXTRAVIADO` - no se ubica físicamente
          * `BAJA`       - retirado del catálogo activo
      enum: [DISPONIBLE, PRESTADO, EXTRAVIADO, BAJA]
      example: DISPONIBLE

    LibroRequest:
      type: object
      description: Datos de entrada para registrar o actualizar un libro
      required: [titulo, autor, isbn, anioPublicacion, estado]
      properties:
        titulo:
          type: string
          minLength: 1
          maxLength: 150
          description: Título del libro
          example: "Cien años de soledad"
        autor:
          type: string
          minLength: 1
          maxLength: 120
          description: Nombre completo del autor
          example: "Gabriel García Márquez"
        isbn:
          type: string
          description: ISBN-10 o ISBN-13, admite guiones. Debe ser único en el catálogo.
          minLength: 10
          maxLength: 17
          pattern: "^[0-9Xx-]{10,17}$"
          example: "978-84-376-0494-7"
        anioPublicacion:
          type: integer
          format: int32
          minimum: 1450
          maximum: 2100
          description: Año de publicación del libro
          example: 1967
        estado:
          $ref: '#/components/schemas/EstadoLibro'

    LibroResponse:
      type: object
      description: Representación de un libro del catálogo
      properties:
        id:
          type: integer
          format: int64
          description: Identificador único generado por el sistema
          example: 1
        titulo:
          type: string
          example: "Cien años de soledad"
        autor:
          type: string
          example: "Gabriel García Márquez"
        isbn:
          type: string
          example: "978-84-376-0494-7"
        anioPublicacion:
          type: integer
          format: int32
          example: 1967
        estado:
          $ref: '#/components/schemas/EstadoLibro'

    ErrorResponse:
      type: object
      description: Estructura estándar de error de la API
      properties:
        timestamp:
          type: string
          format: date-time
          example: "2026-09-18T10:15:30"
        status:
          type: integer
          format: int32
          example: 404
        error:
          type: string
          example: "Not Found"
        message:
          type: string
          example: "No existe un libro con el titulo 'El Quijote'"
        path:
          type: string
          example: "/api/v1/libros/titulo/El%20Quijote"
        detalles:
          type: array
          description: Detalle por campo cuando la validación falla
          items:
            type: string
          example: ["titulo: no debe estar vacio"]

  responses:
    SolicitudInvalida:
      description: La solicitud contiene datos inválidos o mal formados
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: "2026-09-18T10:15:30"
            status: 400
            error: "Bad Request"
            message: "Error de validacion en los datos enviados"
            path: "/api/v1/libros"
            detalles: ["anioPublicacion: debe ser mayor o igual a 1450"]
    NoEncontrado:
      description: El recurso solicitado no existe
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: "2026-09-18T10:15:30"
            status: 404
            error: "Not Found"
            message: "No existe un libro con el id 99"
            path: "/api/v1/libros/99"
            detalles: []
    Conflicto:
      description: El recurso entra en conflicto con otro existente (ISBN duplicado)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: "2026-09-18T10:15:30"
            status: 409
            error: "Conflict"
            message: "Ya existe un libro registrado con el ISBN 978-84-376-0494-7"
            path: "/api/v1/libros"
            detalles: []
    ErrorInterno:
      description: Error inesperado del servidor
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: "2026-09-18T10:15:30"
            status: 500
            error: "Internal Server Error"
            message: "Ocurrio un error inesperado. Contacte al administrador."
            path: "/api/v1/libros"
            detalles: []
